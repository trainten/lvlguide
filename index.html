<meta name="theme-color" content="#12081c">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Level-guide</title>

<style>
:root{--bg:#100818;--ink:#f4ecff;--muted:#b19bc6;--card:#1c1328;--line:#3b2754;--fel:#9be15d;--fel-dim:#4d8a22;--danger:#ff7a59;--radius:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(circle at 90% -10%, #4a1a8a55 0, transparent 42%),
    radial-gradient(circle at 0% 100%, #2a4a1255 0, transparent 38%),
    var(--bg);
  color:var(--ink);
  max-width:520px;margin:0 auto;
  padding:0 14px;
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
}
.card{background:var(--card);border-radius:var(--radius);padding:20px 16px;border:1px solid var(--line);box-shadow:0 6px 18px #0005}
h1{font-size:1.25rem;margin:0 0 8px}
.muted{color:var(--muted);font-size:.9rem;margin:0 0 12px;line-height:1.4}
input[type=password]{width:100%;font-size:1.1rem;padding:14px;border-radius:12px;border:1px solid var(--line);background:#140c1f;color:var(--ink);margin:6px 0 10px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:1.05rem;font-weight:700;cursor:pointer;background:var(--fel);color:#102005;box-shadow:0 4px 0 var(--fel-dim);margin:8px 0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--fel-dim)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin:0 0 6px}
.remember{display:flex;align-items:center;gap:10px;font-size:.9rem;margin:8px 0 12px;cursor:pointer;user-select:none}
.remember input{width:18px;height:18px;accent-color:var(--fel);flex:0 0 18px}
</style>
</head>
<body>
  <div class="card">
    <h1>🔮 Level-guide</h1>
    <p class="muted">Skriv inn passord for å åpne guiden.</p>
    <form id="lockForm">
      <input type="password" id="pw" autocomplete="current-password" placeholder="Passord" aria-label="Passord">
      <label class="remember"><input type="checkbox" id="remember"> Husk meg på denne enheten</label>
      <div class="err" id="lockErr"></div>
      <button class="btn" id="btnOpen" type="submit">Åpne</button>
    </form>
  </div>

const DEVICE_KEY = "lvlguide-device-key-v1";

function b64ToBytes(s){
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64(buf){
  const bytes = new Uint8Array(buf);
  let s = "";
  for(let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

async function deriveKey(password, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"},
    base,
    {name:"AES-GCM", length:256},
    true,
    ["decrypt"]
  );
}

async function importRawKey(b64){
  return crypto.subtle.importKey("raw", b64ToBytes(b64), {name:"AES-GCM"}, true, ["decrypt"]);
}

async function decryptWithKey(key){
  const iv = b64ToBytes(BLOB.iv);
  const ct = b64ToBytes(BLOB.ct);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return new TextDecoder().decode(plain);
}

function showApp(html){
  // document.write after await must run in a later task, otherwise
  // open() may not replace the finished document.
  setTimeout(function(){
    document.open("text/html","replace");
    document.write(html);
    document.close();
  }, 0);
}

async function tryRemembered(){
  const stored = localStorage.getItem(DEVICE_KEY);
  if(!stored) return false;
  try{
    const key = await importRawKey(stored);
    const html = await decryptWithKey(key);
    showApp(html);
    return true;
  }catch(e){
    localStorage.removeItem(DEVICE_KEY);
    return false;
  }
}

const form = document.getElementById("lockForm");
const err = document.getElementById("lockErr");
const btn = document.getElementById("btnOpen");

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  err.textContent = "";
  const pw = document.getElementById("pw").value;
  if(!pw){ err.textContent = "Feil passord."; return; }
  btn.disabled = true;
  btn.textContent = "Åpner…";
  try{
    const key = await deriveKey(pw, b64ToBytes(BLOB.salt), BLOB.iter);
    const html = await decryptWithKey(key);
    if(document.getElementById("remember").checked){
      const raw = await crypto.subtle.exportKey("raw", key);
      localStorage.setItem(DEVICE_KEY, bytesToB64(raw));
    }else{
      localStorage.removeItem(DEVICE_KEY);
    }
    document.getElementById("pw").value = "";
    showApp(html);
  }catch(e){
    err.textContent = "Feil passord.";
    btn.disabled = false;
    btn.textContent = "Åpne";
  }
});

tryRemembered();
})();
